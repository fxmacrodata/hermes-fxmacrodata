name: fxmacrodata
version: 0.2.0
manifest_version: 2
kind: standalone
author: FXMacroData
license: MIT
requires_hermes: '>=0.21'
description: Sourced macroeconomic research through public FXMacroData tools
homepage: https://fxmacrodata.com/?utm_source=hermes&utm_medium=integration&utm_campaign=hermes-fxmacrodata&utm_content=homepage
requires_env: []
optional_env:
  - FXMACRODATA_API_KEY
python_dependencies:
  - 'requests>=2.31,<3'
  - 'urllib3>=2,<3'
  - 'jsonschema>=4.18,<5'
  - 'referencing>=0.28,<1'
config_schema:
  timeout_seconds:
    type: number
    default: 30
    description: Request timeout in seconds
provides_hooks: []
provides_tools:
