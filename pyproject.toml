[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fxmacrodata"
version = "0.2.0"
description = "Native Hermes macroeconomic research tools with source citations"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["requests>=2.31,<3", "urllib3>=2,<3", "jsonschema>=4.18,<5", "referencing>=0.28,<1"]

[project.entry-points."hermes_agent.plugins"]
fxmacrodata = "hermes_fxmacrodata"

[project.urls]
Homepage = "https://fxmacrodata.com/?utm_source=pypi&utm_medium=referral&utm_campaign=hermes-fxmacrodata&utm_content=homepage"
Documentation = "https://fxmacrodata.com/documentation/reference?utm_source=pypi&utm_medium=referral&utm_campaign=hermes-fxmacrodata&utm_content=docs"

[tool.setuptools]
packages = ["hermes_fxmacrodata", "hermes_fxmacrodata.public_client"]

[tool.setuptools.package-data]
hermes_fxmacrodata = ["skills/*/SKILL.md", "public_client/*.json", "public_client/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
